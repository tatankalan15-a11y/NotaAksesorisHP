name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches: [main, master]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore ~/.android/debug.keystore
          fi
          if [ ! -f keystore/release.keystore ]; then
            echo "WARNING: keystore/release.keystore tidak ada"
          fi

      - name: Peringatan - repository publik
        if: github.event.repository.private == false
        run: echo "::warning title=Repository PUBLIK::Kunci tanda tangan (keystore/) ikut terlihat oleh siapa pun. Jadikan repository Private. Lihat KEAMANAN.md"

      - name: Peringatan - password keystore masih bawaan
        env:
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PW" ]; then
            echo "::warning title=Password keystore masih bawaan::Isi GitHub Secrets RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD, RELEASE_KEY_ALIAS. Lihat KEAMANAN.md"
          fi

      - run: npm install --legacy-peer-deps
      - run: npm run build:web
      - run: npx cap add android
      - name: Patch Android (manifest, plugin, version, signing)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Default password keystore di repo (bisa diganti lewat GitHub Secrets)
          export RELEASE_STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-NotaHP2026Release}"
          export RELEASE_KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-NotaHP2026Release}"
          export RELEASE_KEY_ALIAS="${RELEASE_KEY_ALIAS:-notaservicehp}"
          node scripts/patch-android.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        run: cd android && ./gradlew assembleDebug

      - name: Build Release APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: cd android && ./gradlew assembleRelease

      - name: Upload Debug APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NotaAksesorisHP-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: github.event_name == 'push' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: NotaAksesorisHP-release-apk
          path: android/app/build/outputs/apk/release/
          if-no-files-found: warn
